<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Run Log — My Running Journey</title>
    <link rel="icon" type="image/x-icon" href="/assets/emoji-trophy.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style/style.css" />
    <script>
      // Apply saved/system theme before first paint to avoid a flash of the wrong theme
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var theme =
            saved ||
            (window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!-- Bubble stream layer (encouragement messages floating up) -->
    <div id="bubbleLane" class="bubble-lane" aria-hidden="true"></div>

    <div class="phone-shell">
      <!-- HEADER -->
      <header class="header">
        <div class="header-top">
          <div class="profile">
            <img
              id="profilePhoto"
              class="profile-photo"
              src="https://api.dicebear.com/7.x/notionists/svg?seed=Runner"
              alt="Profile photo"
            />
            <div class="profile-text">
              <p class="greeting" id="greeting">Good morning</p>
              <h1 class="profile-name" id="profileName">Runner</h1>
              <div class="profile-bio">
                <span class="profile-bio-text" id="profileBio"></span>
              </div>
            </div>
          </div>
          <div class="bib" id="bibDate">
            <span class="bib-label">Today</span>
            <span class="bib-date" id="todayDate">—</span>
          </div>
        </div>

        <div class="progress-row">
          <div class="progress-track">
            <div
              class="progress-fill"
              id="progressFill"
              style="width: 0%"
            ></div>
          </div>
          <span class="progress-label" id="progressLabel">0 / 0 Done</span>
        </div>

        <button type="button" class="countdown-badge" id="countdownBadge" hidden></button>
      </header>

      <!-- TODO PANEL -->
      <main class="panel">
        <div class="panel-heading">
          <span class="panel-title">RUNNING EVENT LIST</span>
          <div class="panel-actions">
            <button class="icon-btn" id="statsBtn" title="Statistics & progress">
              📊
            </button>
            <button class="icon-btn refresh-btn" id="refreshBtn" title="Refresh">
              ⟳
            </button>
          </div>
        </div>
        <div id="listState" class="list-state">Loading..</div>
        <ul class="todo-list" id="todoList" hidden></ul>
      </main>
    </div>

    <!-- FLOATING ACTION BUTTON -->
    <button class="fab" id="fabBtn">
      <span class="fab-icon">💛</span>
      <span class="fab-text">Kind of Words!</span>
    </button>

    <!-- THEME TOGGLE (floating, bottom-right) -->
    <button
      class="theme-toggle"
      id="themeToggle"
      aria-label="Toggle light/dark mode"
      title="Toggle light/dark mode"
    >
      <span class="theme-toggle-icon" id="themeToggleIcon">🌙</span>
    </button>

    <!-- MODAL -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-card">
        <button class="modal-close" id="modalClose" aria-label="Close">
          ✕
        </button>
        <h2 class="modal-title">Cheer Them On 💛</h2>
        <p class="modal-sub">
          A few kind words can make every step feel a little lighter.
        </p>
        <form id="encouragementForm">
          <label class="field-label" for="nameInput">
            Your Name (optional)
          </label>
          <input
            type="text"
            id="nameInput"
            class="field-input"
            placeholder="@anonymous"
            maxlength="40"
          />
          <label class="field-label" for="msgInput">
            Leave a Little Encouragement
          </label>
          <textarea
            id="msgInput"
            class="field-textarea"
            placeholder="You've got this! Keep going, one step at a time. 🔥"
            maxlength="200"
            required
          ></textarea>
          <div class="char-counter"><span id="charCount">0</span>/200</div>
          <button type="submit" class="submit-btn" id="submitBtn">
            Send Some Love 💛
          </button>
          <p class="form-status" id="formStatus"></p>
        </form>
      </div>
    </div>

    <!-- STATS MODAL -->
    <div class="modal-overlay" id="statsOverlay">
      <div class="modal-card">
        <button class="modal-close" id="statsClose" aria-label="Close">
          ✕
        </button>
        <h2 class="modal-title">Statistics & Progress 📊</h2>
        <p class="modal-sub">Your running journey summary so far.</p>

        <div class="stats-grid" id="statsGrid"></div>
        <div class="badges-row" id="badgesRow"></div>

        <button type="button" class="submit-btn" id="shareBtn">
          Share Progress 📤
        </button>
        <p class="form-status" id="shareStatus"></p>
      </div>
    </div>

    <!-- NEXT EVENT MODAL -->
    <div class="modal-overlay" id="nextEventOverlay">
      <div class="modal-card">
        <button class="modal-close" id="nextEventClose" aria-label="Close">
          ✕
        </button>
        <h2 class="modal-title">Next Event 🏁</h2>
        <p class="modal-sub">Details of your nearest running event.</p>

        <div class="next-event-card" id="nextEventCard"></div>

        <button type="button" class="submit-btn" id="nextEventShareBtn">
          Share as Image 📤
        </button>
        <p class="form-status" id="nextEventShareStatus"></p>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
